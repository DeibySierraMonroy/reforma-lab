server:
  port: ${PORT}
spring:
  application:
    name: "ms-reform"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  datasource:
    url: ${URL}
    username: ${USER}
    password: ${PASSWORD}
    driverClassName: oracle.jdbc.OracleDriver
    hikari:
      connectionTimeout: 30000
      idleTimeout: 300000
      maxLifetime: 1800000
      minimumIdle: 3
      maximumPoolSize: 20
      leakDetectionThreshold: 1800000
  jpa:
    databasePlatform: "org.hibernate.dialect.OracleDialect"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true

# API custom properties
api:
  response:
    log-level: INFO
